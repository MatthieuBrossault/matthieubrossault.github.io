<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matthieu Brossault — Fullstack .NET Engineer</title>
    <meta name="description" content="Portfolio of Matthieu Brossault, Fullstack .NET Engineer. Nantes, France." />
    <link rel="shortcut icon" href="/vcard/logo.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main>
      <aside class="sidebar" data-sidebar>
        <div class="sidebar-info">
          <figure class="avatar-box">
            <img src="/vcard/my-avatar.png" alt="" width="80" id="sidebar-avatar" />
          </figure>
          <div class="info-content">
            <h1 class="name" data-i18n="hero.title">Matthieu Brossault</h1>
            <p class="title" data-i18n="hero.subtitle">Fullstack .NET Engineer</p>
          </div>
          <button class="info_more-btn" type="button" data-sidebar-btn>
            <span data-i18n="sidebar.showContacts">Show Contacts</span>
            <ion-icon name="chevron-down"></ion-icon>
          </button>
        </div>
        <div class="sidebar-info_more">
          <div class="separator"></div>
          <ul class="contacts-list">
            <li class="contact-item" id="sidebar-email-row" hidden>
              <div class="icon-box">
                <ion-icon name="mail-outline"></ion-icon>
              </div>
              <div class="contact-info">
                <p class="contact-title" data-i18n="sidebar.emailTitle">Email</p>
                <a href="#" class="contact-link" id="sidebar-email-link"></a>
              </div>
            </li>
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="location-outline"></ion-icon>
              </div>
              <div class="contact-info">
                <p class="contact-title" data-i18n="sidebar.locationTitle">Location</p>
                <address data-i18n="about.location">Nantes, France</address>
              </div>
            </li>
          </ul>
          <div class="separator"></div>
          <ul class="social-list" id="sidebar-social"></ul>
        </div>
      </aside>

      <div class="main-content">
        <nav class="navbar">
          <ul class="navbar-list">
            <li class="navbar-item">
              <button class="navbar-link active" type="button" data-nav-link data-target-page="about" data-i18n="nav.about">About</button>
            </li>
            <li class="navbar-item">
              <button class="navbar-link" type="button" data-nav-link data-target-page="resume" data-i18n="nav.resume">Resume</button>
            </li>
            <li class="navbar-item">
              <button class="navbar-link" type="button" data-nav-link data-target-page="portfolio" data-i18n="nav.portfolio">Portfolio</button>
            </li>
            <li class="navbar-item">
              <button class="navbar-link" type="button" data-nav-link data-target-page="contact" data-i18n="nav.contact">Contact</button>
            </li>
            <li class="navbar-item lang-switcher-wrap">
              <span id="lang-switcher"></span>
            </li>
          </ul>
        </nav>

        <article class="about active" data-page="about">
          <header>
            <h2 class="h2 article-title" data-i18n="about.heading">About</h2>
          </header>
          <section class="about-text" id="about-text"></section>
          <section class="service">
            <h3 class="h3 service-title" data-i18n="services.title">What I'm doing</h3>
            <ul class="service-list" id="service-list"></ul>
          </section>
        </article>

        <article class="resume" data-page="resume">
          <header>
            <h2 class="h2 article-title" data-i18n="resume.articleTitle">Resume</h2>
          </header>
          <section class="timeline" id="resume-education-block" hidden>
            <div class="title-wrapper">
              <div class="icon-box">
                <ion-icon name="book-outline"></ion-icon>
              </div>
              <h3 class="h3" data-i18n="resume.educationTitle">Education</h3>
            </div>
            <ol class="timeline-list" id="resume-education-list"></ol>
          </section>
          <section class="timeline">
            <div class="title-wrapper">
              <div class="icon-box">
                <ion-icon name="book-outline"></ion-icon>
              </div>
              <h3 class="h3" data-i18n="resume.experienceTitle">Experience</h3>
            </div>
            <ol class="timeline-list" id="resume-experience-list"></ol>
          </section>
          <section class="skill">
            <h3 class="h3 skills-title" data-i18n="resume.skillsTitle">My skills</h3>
            <ul class="skills-list content-card" id="resume-skills-list"></ul>
          </section>
          <section class="skill" id="resume-skill-categories-section" hidden>
            <h3 class="h3 skills-title" data-i18n="resume.skillCategoriesTitle">Skill map</h3>
            <div class="content-card skill-categories-card" id="resume-skill-categories"></div>
          </section>
        </article>

        <article class="portfolio" data-page="portfolio">
          <header>
            <h2 class="h2 article-title" data-i18n="projects.heading">Portfolio</h2>
          </header>
          <section class="projects">
            <ul class="project-list" id="project-list"></ul>
          </section>
        </article>

        <article class="contact" data-page="contact">
          <header>
            <h2 class="h2 article-title" data-i18n="contact.heading">Contact</h2>
          </header>
          <section class="contact-page">
            <p class="contact-page-intro" data-i18n="contact.intro"></p>
            <ul class="contact-page-list" id="contact-page-links"></ul>
          </section>
        </article>
      </div>
    </main>

    <script type="application/ld+json" id="json-ld-person">
      {"@context":"https://schema.org","@type":"Person","name":"Matthieu Brossault","jobTitle":"Fullstack .NET Engineer","address":{"@type":"PostalAddress","addressLocality":"Nantes","addressCountry":"FR"},"sameAs":["https://fr.linkedin.com/in/matthieu-brossault","https://github.com/MatthieuBrossault"]}
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
